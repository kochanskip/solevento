    <meta name="description" content="Whether you're a complete beginner or you already consider yourself to be at the advanced stages, come join a pottery workshop at Solevento Ceramics. We have workshops available for all levels and they take place in our beautiful studio in Penela, Portugal. From beginner sessions to private group experiences, come unlock your imagination, get your hands dirty and bring your pieces to life in the Portuguese countryside.">
    <meta name="keywords" content="solevento, portugal, penela, coimbra, ceramics, pottery, handcrafted, handmade, chemical free, glaze, mug, bowl, vase, cup, nature, artisan, workshop, sculpting, thorwing, beginner, advanced, clay">

<body>

<!-- Header & Navigation -->

    <nav class="navbar navbar-expand-md">

            <!-- Logo -->
            <div>
                <a href="index.html">
                    <img src="images/logo.svg" alt="Logo" style="max-height: 100px;" class="me-3">
                </a>
            </div>

            <!-- Collapsible menu -->
            <div class="collapse navbar-collapse d-none d-md-flex" id="navbarNav">
                <ul class="nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link active" href="workshops.html">Workshops & Classes</a></li>

</header>

<main>
    <!-- Workshops Section -->
    <section class="workshops-section py-3">
        <div class="container">
            <h3 class="section-heading">Private Sessions</h3>
            <div id="private-workshops-list" class="row g-4">
                <!-- Workshops will be injected here -->
            </div>
        </div>
        <div class="container" style="padding-top: 1em;">
            <h3 class="section-heading">Group Workshops</h3>
            <div id="group-workshops-list" class="row g-4">
                <!-- Workshops will be injected here -->
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="text-muted border-top">
    <div class="bg-light border-bottom py-2">
        <div class="container d-flex flex-column align-items-center text-center">
            <!-- Icons -->
            <div class="override-bootstrap d-flex justify-content-center">
                <span class="text-muted small me-3">
                    <i class="bi bi-geo-alt-fill me-2"></i> Solevento ceramics, Penela, Portugal
                </span>
                <a href="mailto:solevento.ceramics@gmail.com" class="text-muted me-3">
                    <i class="bi bi-envelope"></i>
                </a>
                <a href="https://www.instagram.com/solevento.ceramics" target="_blank" class="text-muted">
                    <i class="bi bi-instagram"></i>
                </a>
            </div>
        </div>
    </div>
</footer>

<script>
    async function loadWorkshops() {
        let workshops;
        try {
            const res = await fetch("content/events/workshops.json");
            workshops = await res.json();
        } catch (e) {
            console.warn("Falling back to sample data (CORS/local dev issue)", e);
            workshops = [
                {
                    id: 1,
                    title:"Pottery Wheel - Beginner",
                    category: "Private",
                    date:"Scheduled individually",
                    duration:"1.5 hours",
                    description:"Learn the basics of wheel throwing and create your first ceramic mug or bowl.",
                    image:"content/events/images/PotteryWheelBeginner.webp",
                    price: "€35"
                },
                {
                    id: 2,
                    title:"Pottery Wheel - Intermediate",
                    category: "Private",
                    date:"Scheduled individually",
                    duration:"1.5 hours",
                    description:"Already learnt the basics? Have a go at our intermediate workshop to further improve your skills.",
                    image:"content/events/images/PotteryWheelIntermediate.webp",
                    price: "€35"
                },
                {
                    id: 3,
                    title:"Throw and Decorate",
                    category: "Private",
                    date:"Scheduled individually",
                    duration:"2.5 hours",
                    description:"Discover throwing techniques and explore ways to personalise your piece, all in one session.",
                    image:"content/events/images/ThrowAndDecorate.webp",
                    price: "€50"
                },
                {
                    id: 4,
                    title:"Kids & Parents Ceramic Class",
                    category: "Group",
                    date:"Available from 15/09/2026",
                    duration:"1.5 hours (x4)",
                    description:"Weekly after school ceramics class for both kids and parents",
                    requirements: "Join a  group session where your teacher will guide you through the basics of handbuilding pottery. No experience needed — family friendly.",
                    image:"content/events/images/KidsAndParentsCeramicClass.webp",
                    price: "€65"
                },
                {
                    id: 5,
                    title:"Kids Ceramic Class",
                    category: "Group",
                    date:"Available from 15/09/2026",
                    duration:"1 hour (x4)",
                    description:"Weekly after school ceramics class for kids",
                    requirements: "Join a  group session where your teacher will guide you through the basics of handbuilding pottery. No experience needed.",
                    image:"content/events/images/KidsCeramicClass.webp",
                    price: "€40"
                }
            ];
        }

        let privateWorkshops = workshops.filter(w => w.category === "Private");
        let groupWorkshops = workshops.filter(w => w.category === "Group");

        const privateWorkshopsContainer = document.getElementById("private-workshops-list");
        const groupWorkshopsContainer = document.getElementById("group-workshops-list");
        if (privateWorkshopsContainer) {
            privateWorkshopsContainer.innerHTML = privateWorkshops.map(w => `
                <div class="col-md-4 product-card">
                  <div class="workshops-item card h-100 shadow-sm">
                    <a href="workshop.html?id=${w.id}">
                        <img src="${w.image}" class="product-image card-img-top" alt="${w.title}">

                        <div class="card-body">
                          <h5 class="card-title">${w.title}<span style="float: right">${w.price}</span></h5>
                          <p class="card-text">${w.date}</p>
                          <p class="card-text">${w.description}</p>
                        </div>
                    </a>
                  </div>
                </div>
            `).join("");
        }

        if (groupWorkshopsContainer) {
            groupWorkshopsContainer.innerHTML = groupWorkshops.map(w => `
                <div class="col-md-4 product-card">
                  <div class="workshops-item card h-100 shadow-sm">
                    <a href="workshop.html?id=${w.id}">
                        <img src="${w.image}" class="product-image card-img-top" alt="${w.title}">

                        <div class="card-body">
                          <h5 class="card-title">${w.title}<span style="float: right">${w.price}</span></h5>
                          <p class="card-text">${w.date}</p>
                          <p class="card-text">${w.description}</p>
                        </div>
                    </a>
                  </div>
                </div>
            `).join("");
        }
    }
    loadWorkshops();
</script>

<!-- Bootstrap JS -->
<script src="scripts/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
