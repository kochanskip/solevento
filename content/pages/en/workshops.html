<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshops | Solevento Ceramics</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="description" content="Whether you're a complete beginner or you already consider yourself to be at the advanced stages, come join a pottery workshop at Solevento Ceramics. We have family friendly workshops, tailored sessions and weekly classes suitable for kids. All taking place in our beautiful studio in Penela, Portugal. From beginner sessions to private group experiences, come unlock your imagination, get your hands dirty and bring your pieces to life in the Portuguese countryside.">
    <meta name="keywords" content="solevento, portugal, Penela, Coimbra, ceramics, pottery, handcrafted, handmade, chemical free, glaze, mug, bowl, vase, cup, nature, artisan, workshop, class, families, family friendly, kids, children, all levels, sculpting, throwing, beginner, advanced, clay">
    <!-- Bootstrap CSS -->
    <link href="/scripts/bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/scripts/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Header & Navigation -->
<header id="header-banner" class="py-3">
    <nav class="navbar navbar-expand-md">
        <div id="brand-name" class="container mx-auto">
            <!-- Hamburger button for mobile -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu"
                    aria-controls="mobileMenu"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Logo -->
            <div>
                <a href="/{{lang}}/index.html">
                    <img src="/images/logo.svg" alt="Logo" style="max-height: 100px;" class="me-3">
                </a>
            </div>

            <!-- Collapsible menu -->
            <div class="collapse navbar-collapse d-none d-md-flex" id="navbarNav">
                <ul class="nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/{{lang}}/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/{{lang}}/shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/{{lang}}/workshops.html">Workshops & Classes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/{{lang}}/faqs.html">FAQs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/{{lang}}/about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/{{lang}}/contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="/{{lang}}/index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/{{lang}}/shop.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link active" href="/{{lang}}/workshops.html">Workshops & Classes</a></li>
                <li class="nav-item"><a class="nav-link" href="/{{lang}}/faqs.html">FAQs</a></li>
                <li class="nav-item"><a class="nav-link" href="/{{lang}}/about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="/{{lang}}/contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</header>

<main>
    <!-- Workshops Section -->
    <section class="workshops-section py-3">
        <div class="container">
            <h3 class="section-heading">Private Sessions</h3>
            <div id="private-workshops-list" class="row g-4">
                {{privateCards}}
            </div>
        </div>
        <div class="container" style="padding-top: 2em;">
            <h3 class="section-heading">Group Classes</h3>
            <div id="group-workshops-list" class="row g-4">
                {{groupCards}}
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="text-muted border-top">
    <div class="bg-light border-bottom py-2">
        <div class="container d-flex flex-column align-items-center text-center">
            <!-- Icons -->
            <div class="override-bootstrap d-flex justify-content-center">
                <span class="text-muted small me-3">
                    <i class="bi bi-geo-alt-fill me-2"></i> Solevento ceramics, Penela, Portugal
                </span>
                <a href="mailto:solevento.ceramics@gmail.com" class="text-muted me-3">
                    <i class="bi bi-envelope"></i>
                </a>
                <a href="https://www.instagram.com/solevento.ceramics" target="_blank" class="text-muted">
                    <i class="bi bi-instagram"></i>
                </a>
            </div>
        </div>
    </div>
</footer>



<!-- Bootstrap JS -->
<script src="/scripts/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
