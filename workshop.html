<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop | Solevento Ceramics</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <meta name="description" content="Discover unique, handcrafted ceramics and pottery. Explore a collection of one-of-a-kind mugs, vases, bowls, and decorative art pieces.">
    <meta name="keywords" content="ceramics, pottery, handcrafted, handmade, artisan, art, studio, vase, mug, bowl, sculptural, home decor">
    <!-- Bootstrap CSS -->
    <link href="scripts/bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="scripts/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header & Navigation -->
<header id="header-banner" class="py-3">
    <nav class="navbar navbar-expand-md">
        <div id="brand-name" class="container mx-auto">
            <!-- Hamburger button for mobile -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu"
                    aria-controls="mobileMenu"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Logo -->
            <div>
                <a href="index.html">
                    <img src="images/logo.png" alt="Logo" style="max-height: 100px;margin-left: 25px;" class="me-3">
                </a>
            </div>

            <!-- Collapsible menu -->
            <div class="collapse navbar-collapse d-none d-md-flex" id="navbarNav">
                <ul class="nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active" href="workshops.html">Workshops</a></li>
                    <li class="nav-item"><a class="nav-link" href="faqs.html">FAQs</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="workshops.html">Workshops</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="faqs.html">FAQs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</header>

<main>
    <section class="workshop-section py-3">
        <div class="container">
            <div id="workshop-detail" class="row justify-content-center"></div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="text-muted border-top">
    <div class="bg-light border-bottom py-2">
        <div class="container d-flex flex-column align-items-center text-center">
            <!-- Icons -->
            <div class="override-bootstrap d-flex justify-content-center">
                <span class="text-muted small me-3">
                    <i class="bi bi-geo-alt-fill me-2"></i> Solevento ceramics, Penela, Portugal
                </span>
                <a href="mailto:example@email.com" class="text-muted me-3">
                    <i class="bi bi-envelope"></i>
                </a>
                <a href="https://instagram.com/yourprofile" target="_blank" class="text-muted">
                    <i class="bi bi-instagram"></i>
                </a>
            </div>
        </div>
    </div>
</footer>

<script>
    async function loadWorkshop() {
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get("id"));
        let workshops;

        try {
            const res = await fetch("content/events/workshops.json");
            workshops = await res.json();
        } catch (e) {
            console.warn("Fallback sample workshop", e);
            workshops = [
                {
                    id:1,
                    title:"Pottery Wheel - Beginner",
                    date:"Scheduled individually",
                    duration:"1.5h",
                    longDescription:"Discover the joy of shaping clay on the pottery wheel in this beginner friendly one-on-one workshop. You'll learn the basics of wheel throwing whilst creating your first ever ceramic mug or bowl in a relaxing and supportive environment.",
                    requirements:"No experience needed.",
                    price: "€35",
                    image:"content/events/images/PotteryWheel.jpg"
                },
                {
                    id:2,
                    title:"Pottery Wheel - Intermediate",
                    date:"Scheduled individually",
                    duration:"1.5h",
                    longDescription:"Build confidence with the wheel and develop more advanced throwing techniques in this one-on-one workshop. Refine your centering, shape more complex forms and feel more in control of your future projects.",
                    requirements:"Basic experience with the wheel recommended.",
                    price: "€35",
                    image:"content/events/images/PotteryWheel.jpg"
                },
                {
                    id:3,
                    title:"Throw and Decorate",
                    date:"Scheduled individually",
                    duration:"2.5h",
                    longDescription:"Go further with your imagination and personalise your piece straight after throwing it. Whether you're a first time potter or have prior experience, this workshop gives you an opportunity to express yourself through one of the following decorative techniques:",
                    longDescriptionList:["Carving (sgraffito)", "Stamping or crating textures", "Slip decoration", "Underglaze painting"],
                    requirements:"No experience needed.",
                    price: "€35",
                    image:"content/events/images/PotteryWheel.jpg"
                },
            ];
        }

        const workshop = workshops.find(w => w.id === id);
        if (!workshop) return;

        document.title = workshop.title + " | Sun & Wind Ceramics";

        const container = document.getElementById("workshop-detail");

        container.innerHTML = `
      <div class="col-12">
        <div class="row align-items-stretch">

          <div class="col-md-6 text-center mb-4 mb-md-0">
            <img src="${workshop.image}"
                 alt="${workshop.title}"
                 class="img-fluid craft-image">
          </div>

          <div class="col-md-6">
            <div class="p-2 h-100 d-flex flex-column justify-content-start">
                <h4 class="product-title">${workshop.title}</h4>
                <div class="content">
                  <div>
                    <p>${workshop.longDescription}</p>
                    <div id="product-description-list"></div>
                    <p>${workshop.requirements}</p>
                  </div>
                  <div>
                      <strong>Date:</strong> ${workshop.date}<br>
                      <strong>Duration:</strong> ${workshop.duration}
                    <p>
                    </p>
                  </div>
                </div>
                <h4 class="product-price">${workshop.price}</h4>
                <div class="btn-container">
                    <a href="mailto:info@sunandwindceramics.com?subject=Booking: ${workshop.title}"
                       class="btn email-btn btn-block">
                       Book by Email
                    </a>
                  </div>
            </div>
          </div>

        </div>
      </div>
    `;

        const ul = document.createElement("ul");

        workshop.longDescriptionList?.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
        });

        document
            .getElementById("product-description-list")
            .appendChild(ul);
    }

    loadWorkshop();
</script>

</body>
</html>
