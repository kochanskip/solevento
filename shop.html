<!-- Bootstrap JS -->
<script src="scripts/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
<script>
    const search = document.getElementById("searchProducts");
    const collection = document.getElementById("collectionFilter");
    const sort = document.getElementById("sortProducts");

    const productContainer = document.querySelector("#productContainer");

    function updateProducts() {
        const searchTerm = search.value.toLowerCase().trim();
        const selectedCollection = collection.value;

        const cards = Array.from(
            document.querySelectorAll(".product-card")
        );

        cards.forEach(card => {
            const keywords = card.dataset.keywords.toLowerCase();
            const name = card.dataset.name.toLowerCase();
            const cardCollection = card.dataset.collection;

            const matchesSearch =
                searchTerm === "" ||
                keywords.includes(searchTerm) ||
                name.includes(searchTerm);

            const matchesCollection =
                selectedCollection === "" ||
                cardCollection === selectedCollection;

            card.style.display =
                matchesSearch && matchesCollection
                    ? ""
                    : "none";
        });

        // Sorting
        cards.sort((a, b) => {
            switch (sort.value) {
                case "name":
                    return a.dataset.name.localeCompare(b.dataset.name);
                case "priceAsc":
                    return Number(a.dataset.price) - Number(b.dataset.price);
                case "priceDesc":
                    return Number(b.dataset.price) - Number(a.dataset.price);
                default:
                    return 0;
            }
        });

        // Put cards back in sorted order
        cards.forEach(card => {
            productContainer.appendChild(card);
        });
    }

    // React to changes
    search.addEventListener("input", updateProducts);
    collection.addEventListener("change", updateProducts);
    sort.addEventListener("change", updateProducts);
</script>
